<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>タスク管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1 id="page-title">やることリスト</h1>
</header>

<main id="view-today" class="view">
  <div class="search-filter-bar">
    <input type="search" id="search-input" class="text-input search-input" placeholder="タスクを検索" autocomplete="off">
    <div class="filter-row">
      <select id="filter-status" class="filter-select">
        <option value="active" selected>未完了</option>
        <option value="completed">完了</option>
        <option value="all">すべて</option>
      </select>
      <select id="filter-period" class="filter-select">
        <option value="all" selected>すべての期間</option>
        <option value="today">今日</option>
        <option value="thisWeek">今週</option>
        <option value="later">今週以降</option>
      </select>
      <select id="filter-category" class="filter-select">
        <option value="all" selected>すべてのカテゴリ</option>
        <option value="onsite">現地調査</option>
        <option value="drawing">図面</option>
        <option value="client">施主連絡</option>
        <option value="order">発注</option>
        <option value="unclassified">未分類</option>
      </select>
      <button type="button" id="clear-filters" class="clear-filters-btn" hidden>クリア</button>
    </div>
  </div>

  <section class="task-section" data-section="today">
    <h2 class="section-title today">今日 <span class="count" id="count-today"></span></h2>
    <ul class="task-list" id="list-today"></ul>
  </section>

  <section class="task-section" data-section="thisWeek">
    <h2 class="section-title thisweek">今週 <span class="count" id="count-thisWeek"></span></h2>
    <ul class="task-list" id="list-thisWeek"></ul>
  </section>

  <section class="task-section" data-section="later">
    <h2 class="section-title later">今週以降 <span class="count" id="count-later"></span></h2>
    <ul class="task-list" id="list-later"></ul>
  </section>

  <p class="empty-hint" id="empty-hint" hidden>タスクはありません。右下の「＋」から追加しましょう。</p>

  <p class="filter-result-count" id="filter-result-count" hidden></p>
  <ul class="task-list" id="list-filtered" hidden></ul>
  <p class="empty-hint" id="empty-hint-filtered" hidden>該当するタスクがありません。</p>
</main>

<main id="view-completed" class="view" hidden>
  <ul class="task-list" id="list-completed"></ul>
  <p class="empty-hint" id="empty-hint-completed" hidden>完了したタスクはまだありません。</p>
</main>

<main id="view-calendar" class="view" hidden>
  <div class="calendar-header">
    <button type="button" id="calendar-prev" class="calendar-nav-btn" aria-label="前の月">‹</button>
    <div class="calendar-header-center">
      <h2 class="calendar-label" id="calendar-label"></h2>
      <button type="button" id="calendar-today-btn" class="calendar-today-btn">今日</button>
    </div>
    <button type="button" id="calendar-next" class="calendar-nav-btn" aria-label="次の月">›</button>
  </div>

  <div class="calendar-weekdays">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

  <section class="calendar-day-section">
    <h3 class="calendar-day-title" id="calendar-selected-label"></h3>
    <ul class="task-list" id="calendar-task-list"></ul>
    <p class="empty-hint" id="calendar-empty-hint" hidden>この日のタスクはありません。</p>
  </section>
</main>

<button id="fab-add" class="fab" aria-label="タスクを追加">＋</button>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-today" data-view="today">
    <span class="nav-icon">📋</span><span>タスク</span>
  </button>
  <button class="nav-btn" id="nav-calendar" data-view="calendar">
    <span class="nav-icon">📅</span><span>カレンダー</span>
  </button>
  <button class="nav-btn" id="nav-completed" data-view="completed">
    <span class="nav-icon">✅</span><span>完了済み</span>
  </button>
</nav>

<div id="add-sheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <h2>新しいタスク</h2>
    <form id="add-form">
      <input type="text" id="input-title" class="text-input" placeholder="タスク名を入力" autocomplete="off" required>

      <div class="detail-fields">
        <label class="field-label">締切日（任意）
          <input type="date" id="input-due">
        </label>
        <label class="field-label">優先度（任意）
          <select id="input-priority">
            <option value="">指定なし</option>
            <option value="high">高</option>
            <option value="mid">中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="field-label">カテゴリ（任意）
          <select id="input-category">
            <option value="">未分類</option>
            <option value="onsite">現地調査</option>
            <option value="drawing">図面</option>
            <option value="client">施主連絡</option>
            <option value="order">発注</option>
          </select>
        </label>
      </div>

      <div class="sheet-actions">
        <button type="button" id="cancel-add" class="btn-secondary">キャンセル</button>
        <button type="submit" class="btn-primary">登録</button>
      </div>
    </form>
  </div>
</div>

<div id="edit-sheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <h2>タスクを編集</h2>
    <form id="edit-form">
      <input type="text" id="edit-title" class="text-input" placeholder="タスク名を入力" autocomplete="off" required>

      <div class="detail-fields">
        <label class="field-label">締切日（任意）
          <input type="date" id="edit-due">
        </label>
        <label class="field-label">優先度（任意）
          <select id="edit-priority">
            <option value="">指定なし</option>
            <option value="high">高</option>
            <option value="mid">中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="field-label">カテゴリ（任意）
          <select id="edit-category">
            <option value="">未分類</option>
            <option value="onsite">現地調査</option>
            <option value="drawing">図面</option>
            <option value="client">施主連絡</option>
            <option value="order">発注</option>
          </select>
        </label>
      </div>

      <div class="sheet-actions">
        <button type="button" id="cancel-edit" class="btn-secondary">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="script.js"></script>
</body>
</html>
